<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" stroke="#87ceeb" stroke-width="8"/>
  
  <!-- Clock face -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#87ceeb" stroke-width="3" opacity="0.3"/>
  
  <!-- Clock numbers (12, 3, 6, 9 positions) -->
  <text x="256" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#87ceeb" text-anchor="middle">12</text>
  <text x="412" y="276" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#87ceeb" text-anchor="middle">3</text>
  <text x="256" y="452" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#87ceeb" text-anchor="middle">6</text>
  <text x="100" y="276" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#87ceeb" text-anchor="middle">9</text>
  
  <!-- Hour hand (pointing to 10) -->
  <line x1="256" y1="256" x2="256" y2="180" stroke="#87ceeb" stroke-width="12" stroke-linecap="round" transform="rotate(-60 256 256)"/>
  
  <!-- Minute hand (pointing to 2) -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="#87ceeb" stroke-width="8" stroke-linecap="round" transform="rotate(60 256 256)"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="16" fill="#87ceeb"/>
  
  <!-- Sparkle/motivation element (top right) -->
  <g transform="translate(380, 120)">
    <circle cx="0" cy="0" r="3" fill="#87ceeb"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#87ceeb" stroke-width="2"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#87ceeb" stroke-width="2"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#87ceeb" stroke-width="2"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#87ceeb" stroke-width="2"/>
  </g>
  
  <!-- Quote mark element (bottom left) -->
  <g transform="translate(120, 380)">
    <path d="M 0 0 Q -10 -20 -20 0 Q -10 20 0 0" fill="none" stroke="#87ceeb" stroke-width="3" opacity="0.6"/>
    <path d="M -5 0 Q -15 -20 -25 0 Q -15 20 -5 0" fill="none" stroke="#87ceeb" stroke-width="3" opacity="0.6"/>
  </g>
</svg>

